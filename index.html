<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juiced Golf Tee Times</title>
<style>
body { margin:0; font-family:Arial; background:#0b0b0b; color:white; }
.header { text-align:center; padding:20px 20px 8px; font-size:24px; color:#39FF14; font-weight:bold; }
.subheader { text-align:center; color:#ccc; margin-bottom:12px; }
.card { background:#1a1a1a; margin:10px; padding:15px; border-radius:10px; }
.course { font-size:18px; font-weight:bold; }
.date { color:#39FF14; margin-top:6px; }
.time { color:#ccc; margin:5px 0; }
.button { background:#ff2e2e; padding:10px; border-radius:5px; text-align:center; margin-top:10px; }
.button a { color:white; text-decoration:none; font-weight:bold; display:block; }
</style>
</head>
<body>

<div class="header">Juiced Golf Tee Times</div>
<div class="subheader" id="subheader"></div>
<div id="courses"></div>

<script>
const courses = [
cons
  ["Cog Hill", "6:10 AM", "https://coghillgolf.com/"],
  ["Orchard Valley", "6:20 AM", "https://www.orchardvalleygolf.com/"],
  ["Prairie Bluff", "6:25 AM", "https://prairiebluffgc.com/"],
  ["Mistwood", "6:00 AM", "https://www.mistwoodgc.com/"],
  ["Village Links of Glen Ellyn", "6:30 AM", "https://www.google.com/search?q=Village+Links+of+Glen+Ellyn+tee+times"],
  ["The Preserve at Oak Meadows", "6:20 AM", "https://www.google.com/search?q=The+Preserve+at+Oak+Meadows+tee+times"],
  ["Maple Meadows", "6:15 AM", "https://www.google.com/search?q=Maple+Meadows+Golf+Course+tee+times"],
  ["Arrowhead", "6:30 AM", "https://www.google.com/search?q=Arrowhead+Golf+Club+Wheaton+tee+times"],
  ["Prairie Landing", "6:20 AM", "https://www.google.com/search?q=Prairie+Landing+Golf+Club+tee+times"],
  ["The Sanctuary", "6:25 AM", "https://www.google.com/search?q=The+Sanctuary+Golf+Course+tee+times"],
  ["George Dunne", "6:10 AM", "https://www.google.com/search?q=George+Dunne+Golf+Course+tee+times"],
  ["Wedgewood Golf Course", "6:20 AM", "https://www.google.com/search?q=Wedgewood+Golf+Course+tee+times"],
  ["Naperbrook GC", "6:10 AM", "https://www.google.com/search?q=Naperbrook+Golf+Course+tee+times"],
  ["Springbrook GC", "6:15 AM", "https://www.google.com/search?q=Springbrook+Golf+Course+Naperville+tee+times"],
  ["Bolingbrook Golf Club", "6:30 AM", "https://www.bolingbrookgolfclub.com/"],
  ["Broken Arrow GC", "6:25 AM", "https://www.google.com/search?q=Broken+Arrow+Golf+Club+Lockport+tee+times"],
  ["Phillips Park GC", "6:20 AM", "https://www.google.com/search?q=Phillips+Park+Golf+Course+tee+times"],
  ["Blackberry Oaks GC", "6:30 AM", "https://www.google.com/search?q=Blackberry+Oaks+Golf+Course+tee+times"],
  ["Bliss Creek GC", "6:35 AM", "https://www.google.com/search?q=Bliss+Creek+Golf+Course+tee+times"]
];
];

const today = new Date();
const nextSaturday = new Date(today);
let daysUntilSaturday = (6 - today.getDay() + 7) % 7;
if (daysUntilSaturday === 0) daysUntilSaturday = 7;
nextSaturday.setDate(today.getDate() + daysUntilSaturday);

const dateText = nextSaturday.toLocaleDateString(undefined, {
  weekday: "long",
  month: "long",
  day: "numeric",
  year: "numeric"
});

document.getElementById("subheader").innerText =
  "Earliest morning tee times for " + dateText;

document.getElementById("courses").innerHTML = courses.map(c => `
  <div class="card">
    <div class="course">${c[0]}</div>
    <div class="date">Next Saturday: ${dateText}</div>
    <div class="time">Earliest morning tee time: ${c[1]}</div>
    <div class="button"><a href="${c[2]}" target="_blank">Book</a></div>
  </div>
`).join("");
</script>

</body>
</html>
